[project]
name = "espn-fantasy-hub"
version = "0.1.0"
description = "MCP server that gives Claude a full, read-only view of your ESPN fantasy football and basketball leagues"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "espn-api>=1.0.1,<2",
    "mcp>=1.12,<2",
    "requests>=2.31",
    "tomli>=2.0; python_version < '3.11'",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
espn-fantasy-hub = "espn_fantasy_hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/espn_fantasy_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
